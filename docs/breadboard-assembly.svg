<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180">
  <rect width="1200" height="1180" fill="#f7f7f5"/>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #17202a; }
    .label { font: 700 16px Arial, sans-serif; fill: #17202a; }
    .small { font: 13px Arial, sans-serif; fill: #34495e; }
    .pin { font: 12px monospace; fill: #17202a; }
    .row { font: 11px monospace; fill: #566573; }
    .rail3 { stroke: #e74c3c; stroke-width: 8; }
    .rail5 { stroke: #c0392b; stroke-width: 8; }
    .railG { stroke: #2c3e50; stroke-width: 8; }
    .wire3 { stroke: #e74c3c; stroke-width: 3; fill: none; }
    .wire5 { stroke: #c0392b; stroke-width: 3; fill: none; }
    .wireG { stroke: #2c3e50; stroke-width: 3; fill: none; }
    .wireI { stroke: #2980b9; stroke-width: 3; fill: none; }
    .part { fill: #ffffff; stroke: #34495e; stroke-width: 2; rx: 8; }
    .buttonA { fill: #d5f5e3; stroke: #27ae60; stroke-width: 2; rx: 8; }
    .buttonR { fill: #fadbd8; stroke: #c0392b; stroke-width: 2; rx: 8; }
  </style>

  <text x="40" y="45" class="title">MelodyPay: 60-Row Breadboard Placement</text>
  <text x="40" y="70" class="small">Match the vertical orientation and row numbers shown on your photographed breadboard.</text>

  <rect x="330" y="105" width="540" height="950" rx="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="3"/>
  <rect x="535" y="125" width="90" height="850" fill="#bdc3c7"/>
  <text x="555" y="100" class="small">CENTER TRENCH</text>

  <!-- Four continuous power rails, matching the photographed board. -->
  <line x1="260" y1="125" x2="260" y2="1035" class="rail3"/>
  <line x1="280" y1="125" x2="280" y2="1035" class="railG"/>
  <line x1="920" y1="125" x2="920" y2="1035" class="rail5"/>
  <line x1="940" y1="125" x2="940" y2="1035" class="railG"/>
  <text x="185" y="300" class="pin">LEFT RED = 3V3</text>
  <text x="185" y="325" class="pin">LEFT BLUE = GND</text>
  <text x="950" y="300" class="pin">RIGHT RED = 5V</text>
  <text x="950" y="325" class="pin">RIGHT BLUE = GND</text>

  <!-- Terminal fields. -->
  <g fill="#d5d8dc" stroke="#7f8c8d" stroke-width="0.5">
    <path d="M370 125h125v850H370z" fill="url(#holes)"/>
    <path d="M665 125h125v850H665z" fill="url(#holes)"/>
  </g>
  <defs>
    <pattern id="holes" width="20" height="14" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="2"/><circle cx="25" cy="7" r="2"/>
    </pattern>
  </defs>
  <text x="410" y="100" class="label">a b c d e</text>
  <text x="700" y="100" class="label">f g h i j</text>
  <g class="row">
    <text x="350" y="195">5</text><text x="350" y="265">10</text><text x="350" y="335">15</text>
    <text x="350" y="405">20</text><text x="350" y="475">25</text><text x="350" y="545">30</text>
    <text x="350" y="615">35</text><text x="350" y="685">40</text><text x="350" y="755">45</text>
    <text x="350" y="825">50</text><text x="350" y="895">55</text><text x="350" y="965">60</text>
    <text x="795" y="195">5</text><text x="795" y="265">10</text><text x="795" y="335">15</text>
    <text x="795" y="405">20</text><text x="795" y="475">25</text><text x="795" y="545">30</text>
    <text x="795" y="615">35</text><text x="795" y="685">40</text><text x="795" y="755">45</text>
    <text x="795" y="825">50</text><text x="795" y="895">55</text><text x="795" y="965">60</text>
  </g>

  <!-- Row mapping: y = 125 + (row - 1) * 14. -->
  <rect x="150" y="150" width="135" height="85" class="part"/>
  <text x="165" y="175" class="label">OLED</text>
  <text x="165" y="195" class="small">rows 3-6</text>
  <text x="165" y="215" class="small">one pin/row</text>
  <path d="M285 160 H370" class="wire3"/>

  <rect x="465" y="370" width="230" height="310" class="part"/>
  <text x="510" y="400" class="label">ESP32-S3</text>
  <text x="505" y="425" class="small">rows 20-41</text>
  <text x="505" y="450" class="small">body over gap</text>
  <text x="495" y="500" class="pin">GPIO1 APPROVE</text>
  <text x="495" y="525" class="pin">GPIO2 REJECT</text>
  <text x="495" y="550" class="pin">GPIO8/9 OLED</text>
  <text x="495" y="575" class="pin">3V3 / 5V / GND</text>
  <path d="M465 520 H400" class="wireI"/>
  <path d="M695 520 H750" class="wireI"/>

  <rect x="150" y="735" width="170" height="100" class="part"/>
  <text x="170" y="765" class="label">INMP441</text>
  <text x="170" y="787" class="small">rows 45-50</text>
  <text x="170" y="809" class="small">left terminal area</text>
  <path d="M320 760 H370" class="wireI"/>

  <rect x="900" y="735" width="185" height="115" class="part"/>
  <text x="920" y="765" class="label">MAX98357A</text>
  <text x="920" y="787" class="small">rows 45-51</text>
  <text x="920" y="809" class="small">right terminal area</text>
  <path d="M790 760 H900" class="wireI"/>

  <rect x="430" y="265" width="90" height="35" class="buttonA"/>
  <text x="445" y="288" class="small">APPROVE row 10</text>
  <rect x="650" y="321" width="90" height="35" class="buttonR"/>
  <text x="665" y="344" class="small">REJECT row 14</text>

  <text x="40" y="1100" class="small">Power off before changing wires. Check rails with a multimeter.</text>
  <text x="40" y="1122" class="small">MAX98357A speaker + and - are bridged outputs: never connect either to GND.</text>
</svg>
