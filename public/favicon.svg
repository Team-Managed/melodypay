<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 28" fill="none">
    <!-- 1. BACK CARD (Tilted at -24°, fanned open behind) -->
    <g transform="translate(16.5, 13.5) rotate(-24)">
        <rect
            x="-13"
            y="-8.25"
            width="26"
            height="16.5"
            rx="2.4"
            fill="#131317"
            stroke="#FFFFFF"
            stroke-width="1.3"
            opacity="0.7"
        />
        <line
            x1="-13"
            y1="-4.2"
            x2="13"
            y2="-4.2"
            stroke="#FFFFFF"
            stroke-width="1.2"
            opacity="0.3"
        />
    </g>

    <!-- 2. FRONT CARD (Tilted at -10°, foreground payment card) -->
    <g transform="translate(20, 15.5) rotate(-10)">
        <rect
            x="-13"
            y="-8.25"
            width="26"
            height="16.5"
            rx="2.4"
            fill="#16161A"
            stroke="#FFFFFF"
            stroke-width="1.4"
        />

        <!-- EMV Acoustic Chip (Top-left) -->
        <rect
            x="-10.5"
            y="-6"
            width="5.2"
            height="4"
            rx="0.9"
            fill="#26262F"
            stroke="#FFFFFF"
            stroke-width="0.8"
        />
        <!-- Internal Chip Lines -->
        <line x1="-10.5" y1="-4" x2="-5.3" y2="-4" stroke="#FFFFFF" stroke-width="0.5" opacity="0.8" />
        <line x1="-7.9" y1="-6" x2="-7.9" y2="-2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.8" />

        <!-- Contactless Acoustic Sound Waves ))) -->
        <path
            d="M -3.8 -5.2 C -2.8 -4.4, -2.8 -3.1, -3.8 -2.3"
            stroke="#FFFFFF"
            stroke-width="0.85"
            stroke-linecap="round"
            opacity="0.65"
        />
        <path
            d="M -2.2 -6.0 C -0.8 -4.8, -0.8 -2.7, -2.2 -1.5"
            stroke="#FFFFFF"
            stroke-width="0.85"
            stroke-linecap="round"
            opacity="0.9"
        />

        <!-- Visa-Style "MP" Brandmark -->
        <text
            x="6.2"
            y="5.4"
            text-anchor="middle"
            fill="#FFFFFF"
            font-size="5.8"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-weight="900"
            font-style="italic"
            letter-spacing="-0.5px"
        >MP</text>
    </g>
</svg>
